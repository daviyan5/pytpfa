[RESERVOIR_DESCRIPTION]
NAME = "Nonlinear Case"
GEOM = LINEAR
PROP = HOMOGENEOUS
FLUID = SLIGHTLY_COMPRESSIBLE
ANALYTICAL = "exp(-0.01*t) * (1 + 0.001*x + 0.002*y + 0.003*z + 0.00001*x*y)"

[RESERVOIR_INPUT]
NX = 50
NY = 50
NZ = 20
LX = 200
LY = 100
LZ = 20
KX = 0.100
KY = 0.100
KZ = 0.100
PORO = 0.20
RHO = 50
CPORO = 2.5e-5
MU = 2
B = 1
CFLUID = 2.5e-5

[INITIAL_CONDITION]
PRESSURE = "None"

[TIME_SETTINGS]
TIME_INITIAL = 0         
TIME_FINAL = 0.2           
TIME_STEP = 0.002

[RESERVOIR_BOUNDARY.LEFT]
TYPE = "dirichlet"

[RESERVOIR_BOUNDARY.RIGHT]
TYPE = "dirichlet"

[RESERVOIR_BOUNDARY.FRONT]
TYPE = "dirichlet"

[RESERVOIR_BOUNDARY.BACK]
TYPE = "dirichlet"

[RESERVOIR_BOUNDARY.UP]
TYPE = "dirichlet"

[RESERVOIR_BOUNDARY.DOWN]
TYPE = "dirichlet"

