[RESERVOIR_DESCRIPTION]
NAME = "Quadratic Case"
GEOM = LINEAR
PROP = HOMOGENEOUS
FLUID = SLIGHTLY_COMPRESSIBLE
ANALYTICAL = "x^2 * t + y^2 * t + z^2 * t"

[RESERVOIR_INPUT]
NX = 50
NY = 50
NZ = 50
LX = 200
LY = 100
LZ = 20
KX = 0.100
KY = 0.100
KZ = 0.100
PORO = 0.20
RHO = 50
CPORO = 2.5e-5
MU = 2
B = 1
CFLUID = 2.5e-5

[INITIAL_CONDITION]
PRESSURE = "None"

[TIME_SETTINGS]
TIME_INITIAL = 0         
TIME_FINAL = 0.005           
TIME_STEP = 0.0025

[RESERVOIR_BOUNDARY.LEFT]
TYPE = "dirichlet"

[RESERVOIR_BOUNDARY.RIGHT]
TYPE = "dirichlet"

[RESERVOIR_BOUNDARY.FRONT]
TYPE = "dirichlet"

[RESERVOIR_BOUNDARY.BACK]
TYPE = "dirichlet"

[RESERVOIR_BOUNDARY.UP]
TYPE = "dirichlet"

[RESERVOIR_BOUNDARY.DOWN]
TYPE = "dirichlet"

