[RESERVOIR_DESCRIPTION]
NAME = "Linear Case - Compressible (Exact)"
GEOM = LINEAR
PROP = HOMOGENEOUS
FLUID = SLIGHTLY_COMPRESSIBLE
ANALYTICAL = "1e-2*t*(x + y + z)"

[RESERVOIR_INPUT]
NX = 20
NY = 20
NZ = 10
LX = 200
LY = 100
LZ = 20
KX = 100.0
KY = 100.0
KZ = 100.0
PORO = 0.20
RHO = 50
CPORO = 1.0e-5
MU = 1.0
B = 1.0
CFLUID = 1.0e-5

[INITIAL_CONDITION]
PRESSURE = "None"

[TIME_SETTINGS]
TIME_INITIAL = 0         
TIME_FINAL = 100           
TIME_STEP = 10.0

[RESERVOIR_BOUNDARY.LEFT]
TYPE = "dirichlet"

[RESERVOIR_BOUNDARY.RIGHT]
TYPE = "dirichlet"

[RESERVOIR_BOUNDARY.FRONT]
TYPE = "dirichlet"

[RESERVOIR_BOUNDARY.BACK]
TYPE = "dirichlet"

[RESERVOIR_BOUNDARY.UP]
TYPE = "dirichlet"

[RESERVOIR_BOUNDARY.DOWN]
TYPE = "dirichlet"