paths:
  run_script: "../run.py"
  results_dir: "./results_jarvis"
  temp_dir: "/tmp"

hardware:
  physical_cores: 28
  logical_cpus: 56
  numa_nodes: 2
  cores_per_numa: 16
  num_gpus: 4
  vram_per_gpu_gb: 24
  total_vram_gb: 96
  total_ram_gb: 251
  gpu_model: "Quadro RTX 6000"
  gpu_bandwidth_gb_s: 672


mpi:
  processes: [1, 2, 4, 8, 16, 24, 28]
  omp_num_threads: 1
  bind_to: "none"
  map_by: "node"

gpu:
  use_mps: true
  vec_type: "cuda"
  mat_type: "aijcusparse"

solver:
  ksp_type: "gmres"
  pc_type: "gamg"
  ksp_rtol: 1.0e-8
  ksp_max_it: 1000

correctness:
  cases:
    - name: "example_1"
      path: "examples/example_1/reservoir.ini"
      expected_order: 0.0
      description: "Linear (exact solution for TPFA)"
      meshes:
        - [25, 25, 25]
        - [50, 50, 50]
        - [100, 100, 100]
        - [150, 150, 150]
    - name: "example_3"
      path: "examples/example_3/reservoir.ini"
      expected_order: 2.0
      description: "Nonlinear (spatial convergence)"
      meshes:
        - [25, 25, 25]
        - [50, 50, 50]
        - [100, 100, 100]
        - [150, 150, 150]
    - name: "example_Li"
      path: "examples/example_Li/reservoir.ini"
      expected_order: 2.0
      description: "Li Case 4 (2D well)"
      meshes:
        - [25, 25, 1]
        - [50, 50, 1]
        - [250, 250, 1]
        - [500, 500, 1]
        - [2500, 2500, 1]
        - [3000, 3000, 1]
  use_gpu: true
  mpi_processes: 16
  optimized: false
  postprocess: false
  timeout_hours: 2.0

performance:
  reservoir_base: "examples/example_3/reservoir.ini"
  mesh: [150, 150, 150]
  mpi_processes: [1, 2, 4, 8, 16, 24, 28]
  runs: 2
  optimized: true
  timeout_hours: 10.0

strong_scaling:
  reservoir_base: "examples/example_3/reservoir.ini"
  mesh: [170, 170, 170]
  mpi_processes: [1, 2, 3, 4]
  runs: 2
  optimized: true
  timeout_hours: 10.0

weak_scaling:
  reservoir_base: "examples/example_3/reservoir.ini"
  base_mesh: [100, 100, 100]
  mpi_processes: [1, 2, 3, 4]
  runs: 2
  decomposition:
    1: [100, 100, 100]
    2: [126, 126, 126]
    3: [144, 144, 144]
    4: [158, 158, 158]
  optimized: true
  timeout_hours: 10.0

bandwidth:
  reservoir_base: "examples/example_3/reservoir.ini"
  mesh: [50, 50, 50]
  mpi_processes: 28
  num_gpus: 4
  runs: 1
  optimized: true
  timeout_hours: 12.0
  analysis:
    bytes_per_cell: 64
    stencil_size: 7
    flops_per_cell: 14

solver_comparison:
  reservoir_base: "examples/example_3/reservoir.ini"
  mesh: [200, 200, 200]
  mpi_processes: 28
  runs: 1
  use_gpu: true
  optimized: true
  timeout_hours: 4.0
  solvers:
    - name: "FGMRES+GAMG"
      ksp_type: "fgmres"
      pc_type: "gamg"
      description: "Flexible GMRES + Multigrid Algébrico (padrão)"
    - name: "CG+GAMG"
      ksp_type: "cg"
      pc_type: "gamg"
      description: "Gradiente Conjugado + Multigrid Algébrico"
    - name: "BCGS+GAMG"
      ksp_type: "bcgs"
      pc_type: "gamg"
      description: "BiCGStab + Multigrid Algébrico"
    - name: "CG+BJACOBI"
      ksp_type: "cg"
      pc_type: "bjacobi"
      description: "Gradiente Conjugado + Block Jacobi"
    - name: "GMRES+BJACOBI"
      ksp_type: "gmres"
      pc_type: "bjacobi"
      description: "GMRES + Block Jacobi"
    - name: "BCGS+BJACOBI"
      ksp_type: "bcgs"
      pc_type: "bjacobi"
      description: "BiCGStab + Block Jacobi"
    - name: "CG+JACOBI"
      ksp_type: "cg"
      pc_type: "jacobi"
      description: "Gradiente Conjugado + Jacobi (baseline)"
    - name: "GMRES+JACOBI"
      ksp_type: "gmres"
      pc_type: "jacobi"
      description: "GMRES + Jacobi"