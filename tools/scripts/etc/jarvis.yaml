paths:
  run_script: "../run.py"
  results_dir: "./results_jarvis"
  temp_dir: "/tmp"

hardware:
  physical_cores: 32
  logical_cpus: 64
  numa_nodes: 2
  cores_per_numa: 16
  num_gpus: 4
  vram_per_gpu_gb: 24
  total_vram_gb: 96
  total_ram_gb: 251
  gpu_model: "Quadro RTX 6000"
  gpu_bandwidth_gb_s: 672  # Pico teórico da RTX 6000

mpi:
  processes: [1, 2, 4, 8, 16]
  omp_num_threads: 1
  bind_to: "none"
  map_by: "none"

gpu:
  use_mps: true
  vec_type: "cuda"
  mat_type: "aijcusparse"

solver:
  ksp_type: "fgmres"
  pc_type: "gamg"
  ksp_rtol: 1.0e-8
  ksp_max_it: 1000

correctness:
  cases:
    - name: "example_1"
      path: "examples/example_1/reservoir.ini"
      expected_order: 0.0
      description: "Linear (exact solution for TPFA)"
      meshes:
        - [50, 50, 50]
        - [80, 80, 80]
        - [120, 120, 120]
        - [180, 180, 180]
    - name: "example_3"
      path: "examples/example_3/reservoir.ini"
      expected_order: 2.0
      description: "Nonlinear (spatial convergence)"
      meshes:
        - [50, 50, 50]
        - [80, 80, 80]
        - [120, 120, 120]
        - [180, 180, 180]
    - name: "example_Li"
      path: "examples/example_Li/reservoir.ini"
      expected_order: 2.0
      description: "Li Case 4 (2D well)"
      meshes:
        - [25, 25, 1]
        - [50, 50, 1]
        - [250, 250, 1]
        - [500, 500, 1]
        - [2500, 2500, 1]
        - [3000, 3000, 1]
  use_gpu: true
  mpi_processes: 16
  optimized: false
  postprocess: false
  timeout_hours: 2.0

performance:
  reservoir_base: "examples/example_3/reservoir.ini"
  mesh: [340, 340, 340]  # ~39M células - cabe em 1 GPU (~23GB VRAM)
  mpi_processes: [1, 2, 4, 8, 16]
  runs: 2
  optimized: true
  timeout_hours: 10.0

strong_scaling:
  reservoir_base: "examples/example_3/reservoir.ini"
  mesh: [340, 340, 340]  # ~39M células - problema fixo grande
  mpi_processes: [1, 2, 3, 4]
  runs: 2
  optimized: true
  timeout_hours: 10.0

weak_scaling:
  reservoir_base: "examples/example_3/reservoir.ini"
  base_mesh: [340, 340, 340]  # ~39M células por processo (~23GB/GPU)
  mpi_processes: [1, 2, 3, 4]
  runs: 2
  decomposition:
    1: [340, 340, 340]   # ~39M células (1 GPU, ~23GB)
    2: [428, 428, 428]   # ~78M células (2 GPUs, ~47GB)
    3: [493, 493, 493]   # ~120M células (3 GPUs, ~72GB)
    4: [543, 543, 543]   # ~160M células (4 GPUs, ~96GB)
  optimized: true
  timeout_hours: 10.0

bandwidth:
  reservoir_base: "examples/example_3/reservoir.ini"
  mesh: [543, 543, 543]  # ~160M células - maximiza 4 GPUs (~96GB VRAM)
  mpi_processes: 16
  num_gpus: 4
  runs: 1
  optimized: true
  timeout_hours: 12.0
  analysis:
    bytes_per_cell: 64  # Estimativa: 8 doubles por célula (pressão, fluxos, etc)
    stencil_size: 7     # TPFA 3D: célula central + 6 vizinhos
    flops_per_cell: 14  # Operações por célula no SpMV

solver_comparison:
  reservoir_base: "examples/example_3/reservoir.ini"
  mesh: [250, 250, 250]  # ~15.6M células - representativo sem demorar demais
  mpi_processes: 4
  runs: 2
  use_gpu: true
  optimized: true
  timeout_hours: 4.0
  solvers:
    # GAMG-based (Multigrid Algébrico) - geralmente melhor para sistemas elípticos
    - name: "FGMRES+GAMG"
      ksp_type: "fgmres"
      pc_type: "gamg"
      description: "Flexible GMRES + Multigrid Algébrico (padrão)"
    - name: "CG+GAMG"
      ksp_type: "cg"
      pc_type: "gamg"
      description: "Gradiente Conjugado + Multigrid Algébrico"
    - name: "BCGS+GAMG"
      ksp_type: "bcgs"
      pc_type: "gamg"
      description: "BiCGStab + Multigrid Algébrico"
    
    # Block Jacobi - funciona bem com MPI/GPU
    - name: "CG+BJACOBI"
      ksp_type: "cg"
      pc_type: "bjacobi"
      description: "Gradiente Conjugado + Block Jacobi"
    - name: "GMRES+BJACOBI"
      ksp_type: "gmres"
      pc_type: "bjacobi"
      description: "GMRES + Block Jacobi"
    - name: "BCGS+BJACOBI"
      ksp_type: "bcgs"
      pc_type: "bjacobi"
      description: "BiCGStab + Block Jacobi"
    
    # ASM (Additive Schwarz) - bom para paralelismo
    - name: "GMRES+ASM"
      ksp_type: "gmres"
      pc_type: "asm"
      description: "GMRES + Additive Schwarz"
    - name: "FGMRES+ASM"
      ksp_type: "fgmres"
      pc_type: "asm"
      description: "Flexible GMRES + Additive Schwarz"
    
    # Jacobi puro - baseline simples
    - name: "CG+JACOBI"
      ksp_type: "cg"
      pc_type: "jacobi"
      description: "Gradiente Conjugado + Jacobi (baseline)"
    - name: "GMRES+JACOBI"
      ksp_type: "gmres"
      pc_type: "jacobi"
      description: "GMRES + Jacobi"
    
    # SOR (Successive Over-Relaxation)
    - name: "CG+SOR"
      ksp_type: "cg"
      pc_type: "sor"
      description: "Gradiente Conjugado + SOR"
    
    # Sem precondicionador - baseline absoluto
    - name: "CG+NONE"
      ksp_type: "cg"
      pc_type: "none"
      description: "Gradiente Conjugado sem precondicionador"
    - name: "GMRES+NONE"
      ksp_type: "gmres"
      pc_type: "none"
      description: "GMRES sem precondicionador"