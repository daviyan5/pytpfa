paths:
  run_script: "../run.py"
  results_dir: "./results_jarvis_light"
  temp_dir: "/tmp"

hardware:
  physical_cores: 32
  logical_cpus: 64
  numa_nodes: 2
  cores_per_numa: 16
  num_gpus: 4
  vram_per_gpu_gb: 16
  total_vram_gb: 64
  total_ram_gb: 251

mpi:
  processes: [1, 2, 4, 8, 16]
  omp_num_threads: 1
  bind_to: "none"
  map_by: "none"

gpu:
  use_mps: true
  vec_type: "cuda"
  mat_type: "aijcusparse"

solver:
  ksp_type: "fgmres"
  pc_type: "gamg"
  ksp_rtol: 1.0e-6

correctness:
  cases:
    - name: "example_1"
      path: "examples/example_1/reservoir.ini"
      expected_order: 0.0
      description: "Linear (solução exata)"
      meshes:
        - [20, 20, 10]
        - [40, 40, 20]
        - [60, 60, 30]

    - name: "example_2"
      path: "examples/example_2/reservoir.ini"
      expected_order: 0.0
      description: "Quadrático"
      meshes:
        - [20, 20, 10]
        - [40, 40, 20]
        - [60, 60, 30]

    - name: "example_3"
      path: "examples/example_3/reservoir.ini"
      expected_order: 2.0
      description: "Não-linear (ordem ~2)"
      meshes:
        - [20, 20, 10]
        - [40, 40, 20]
        - [60, 60, 30]

    - name: "example_Li"
      path: "examples/example_Li/reservoir.ini"
      expected_order: 2.0
      description: "Poço (ordem ~2)"
      meshes:
        - [25, 25, 1]
        - [50, 50, 1]
        - [100, 100, 1]

  use_gpu: false
  mpi_processes: 2
  optimized: false
  postprocess: false
  timeout_hours: 0.5

performance:
  reservoir_base: "examples/example_3/reservoir.ini"
  mesh: [30, 30, 30]
  mpi_processes: [1, 2, 4, 8, 16]
  runs: 2
  optimized: true
  timeout_hours: 1.0

strong_scaling:
  reservoir_base: "examples/example_3/reservoir.ini"
  mesh: [30, 30, 30]
  mpi_processes: [1, 2, 3, 4]
  runs: 2
  optimized: true
  timeout_hours: 1.0

weak_scaling:
  reservoir_base: "examples/example_3/reservoir.ini"
  base_mesh: [10, 10, 10]
  mpi_processes: [1, 2, 3, 4]
  runs: 2
  decomposition:
    1: [10, 10, 10]
    2: [12, 12, 12]
    3: [14, 14, 14]
    4: [15, 15, 15]
  optimized: true
  timeout_hours: 1.0