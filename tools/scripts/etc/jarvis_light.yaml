paths:
  run_script: "../run.py"
  results_dir: "./results_jarvis_light"
  temp_dir: "/tmp"

hardware:
  physical_cores: 32
  logical_cpus: 64
  numa_nodes: 2
  cores_per_numa: 16
  num_gpus: 4
  vram_per_gpu_gb: 24
  total_vram_gb: 96
  total_ram_gb: 251
  gpu_model: "Quadro RTX 6000"
  gpu_bandwidth_gb_s: 672


mpi:
  processes: [1, 2, 4, 8, 16, 24, 32]
  omp_num_threads: 1
  bind_to: "numa"
  map_by: "numa"

gpu:
  use_mps: true
  vec_type: "cuda"
  mat_type: "aijcusparse"

solver:
  ksp_type: "fgmres"
  pc_type: "gamg"
  ksp_rtol: 1.0e-6

correctness:
  cases:
    - name: "example_1"
      path: "examples/example_1/reservoir.ini"
      expected_order: 0.0
      description: "Linear (solução exata)"
      meshes:
        - [20, 20, 10]
        - [40, 40, 20]
        - [60, 60, 30]
    - name: "example_3"
      path: "examples/example_3/reservoir.ini"
      expected_order: 2.0
      description: "Não-linear (ordem ~2)"
      meshes:
        - [20, 20, 10]
        - [40, 40, 20]
        - [60, 60, 30]
    - name: "example_Li"
      path: "examples/example_Li/reservoir.ini"
      expected_order: 2.0
      description: "Poço (ordem ~2)"
      meshes:
        - [25, 25, 1]
        - [50, 50, 1]
        - [100, 100, 1]
  use_gpu: false
  mpi_processes: 2
  optimized: false
  postprocess: false
  timeout_hours: 0.5

performance:
  reservoir_base: "examples/example_3/reservoir.ini"
  mesh: [30, 30, 30]
  mpi_processes: [1, 2, 4, 8, 16, 24, 32]
  runs: 2
  optimized: true
  timeout_hours: 1.0

strong_scaling:
  reservoir_base: "examples/example_3/reservoir.ini"
  mesh: [30, 30, 30]
  mpi_processes: [1, 2, 3, 4]
  runs: 2
  optimized: true
  timeout_hours: 1.0

weak_scaling:
  reservoir_base: "examples/example_3/reservoir.ini"
  base_mesh: [10, 10, 10]
  mpi_processes: [1, 2, 3, 4]
  runs: 2
  decomposition:
    1: [10, 10, 10]
    2: [12, 12, 12]
    3: [14, 14, 14]
    4: [15, 15, 15]
  optimized: true
  timeout_hours: 1.0

bandwidth:
  reservoir_base: "examples/example_3/reservoir.ini"
  mesh: [50, 50, 50]
  mpi_processes: 4
  num_gpus: 4
  runs: 1
  optimized: true
  timeout_hours: 1.0
  analysis:
    bytes_per_cell: 64
    stencil_size: 7
    flops_per_cell: 14

solver_comparison:
  reservoir_base: "examples/example_3/reservoir.ini"
  mesh: [80, 80, 80]
  mpi_processes: 4
  runs: 1
  use_gpu: true
  optimized: true
  timeout_hours: 1.0
  solvers:
    - name: "FGMRES+GAMG"
      ksp_type: "fgmres"
      pc_type: "gamg"
      description: "Flexible GMRES + Multigrid Algébrico"
    - name: "CG+GAMG"
      ksp_type: "cg"
      pc_type: "gamg"
      description: "Gradiente Conjugado + Multigrid Algébrico"
    
    - name: "CG+BJACOBI"
      ksp_type: "cg"
      pc_type: "bjacobi"
      description: "Gradiente Conjugado + Block Jacobi"
    - name: "GMRES+BJACOBI"
      ksp_type: "gmres"
      pc_type: "bjacobi"
      description: "GMRES + Block Jacobi"
    
    - name: "GMRES+ASM"
      ksp_type: "gmres"
      pc_type: "asm"
      description: "GMRES + Additive Schwarz"
    
    - name: "CG+JACOBI"
      ksp_type: "cg"
      pc_type: "jacobi"
      description: "Gradiente Conjugado + Jacobi"
    
    - name: "CG+NONE"
      ksp_type: "cg"
      pc_type: "none"
      description: "CG sem precondicionador (baseline)"